timezone: America/Sao_Paulo
currency: BRL

watchlist:
  - origin: POA
    destination: LIS
    date_window:
      start: "2026-11-01"
      end: "2027-03-31"
    trip_length_days: [7, 14]
    cabin: economy
    max_price_brl: 4500
  - origin: POA
    destination: MIA
    date_window:
      start: "2026-11-01"
      end: "2027-03-31"
    trip_length_days: [7, 14]
    cabin: economy
    max_price_brl: 3500
  - origin: POA
    destination: GRU
    date_window:
      start: "2026-10-01"
      end: "2027-03-31"
    trip_length_days: [3, 7]
    cabin: economy
    max_price_brl: 600
  - origin: POA
    destination: EZE
    date_window:
      start: "2026-10-01"
      end: "2027-03-31"
    trip_length_days: [4, 10]
    cabin: economy
    max_price_brl: 1800
  - origin: POA
    destination: CDG
    date_window:
      start: "2026-11-01"
      end: "2027-03-31"
    trip_length_days: [10, 20]
    cabin: economy
    max_price_brl: 5500

deal_detection:
  min_snapshots_for_median: 10
  rolling_window_days: 60
  hot_deal_discount_pct: 25
  error_fare_discount_pct: 50

scan:
  cadence_hours: 6

wide_scan:
  enabled: true
  origin: POA
  cabin: economy

serpapi:
  # Live re-check of possible error fares (>=50% below median) before
  # alerting. Leave enabled but without SERPAPI_KEY set and it's a no-op --
  # error fares still alert directly off cached Travelpayouts data.
  enabled: true

promos:
  enabled: true
  # General relevance filter for RSS/channel items: alerts if any of these
  # appear in the title/summary, in addition to the transfer-bonus and
  # miles-sale rules below (which fire regardless of these keywords).
  keywords:
    - "Porto Alegre"
    - "POA"
    - Smiles
    - "LATAM Pass"
    - "Azul Fidelidade"
    - Livelo
    - Esfera
  transfer_bonus_min_pct: 80
  rss_feeds:
    - name: melhores_destinos
      url: "https://www.melhoresdestinos.com.br/feed"
    - name: pontos_pra_voar
      url: "https://pontospravoar.com/feed/"
    - name: passagens_imperdiveis
      url: "https://passagensimperdiveis.com.br/feed/"
      # Blocked by Cloudflare bot-protection as of 2026-09 even from a
      # regular browser -- left configured since that may change, but the
      # scan logs a warning and skips it rather than failing the run.
  telegram_channels:
    # Needs a one-time interactive login first --
    # see telegram_channels/login.py. Off until you've done that and
    # picked channels to follow.
    enabled: false
    session_name: travel_tracker
    channels: []
    keywords:
      - "Porto Alegre"
      - "POA"

# Phase 3 (deferred): seats.aero award tracking needs a seats.aero Pro
# subscription (~R$50/mo) for an API key -- not wired in yet. Revisit once
# that's decided; the Provider interface makes it a self-contained addition.
miles_programs: []

alerts:
  telegram_enabled: true
  daily_summary: true
  daily_summary_time: "08:00"
